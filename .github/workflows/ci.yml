name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Example tests
        working-directory: example
        run: flutter test

      - name: Package check
        run: dart pub publish --dry-run

  android:
    name: Build the example (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build
        working-directory: example
        run: flutter build apk --debug

  ios:
    name: Build the example (iOS, ${{ matrix.name }})
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # What the example is set up for (example/pubspec.yaml): the podspec.
          - name: CocoaPods
            swift-package-manager: false
          # The Swift package.
          - name: Swift Package Manager
            swift-package-manager: true
    steps:
      # Checked out as "responsly_sdk": with Swift Package Manager, Flutter refers to the plugin
      # of an example app by the name of its directory, which has to be the package name.
      - uses: actions/checkout@v4
        with:
          path: responsly_sdk

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Switch the example to Swift Package Manager
        if: matrix.swift-package-manager
        working-directory: responsly_sdk/example
        run: |
          sed -i '' 's/enable-swift-package-manager: false/enable-swift-package-manager: true/' pubspec.yaml
          grep -q 'enable-swift-package-manager: true' pubspec.yaml

      - name: Build
        working-directory: responsly_sdk/example
        run: flutter build ios --simulator --debug
